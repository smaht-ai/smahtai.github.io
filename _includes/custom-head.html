{% comment %}
  Site-specific head: favicons, Open Graph defaults helpers, JSON-LD, analytics.
{% endcomment %}

<!-- Favicon -->
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="48x48" href="{{ '/assets/images/favicon-48.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">

<!-- JSON-LD structured data -->
{%- include json-ld.html -%}
