title: Smaht.AI
author:
  name: Smaht.AI
  email: "hello@smaht.ai"
description: > # this means to ignore newlines until "show_excerpts:"
  Smaht.ai is a community of experienced AI engineers and entrepreneurs who are passionate about building products and building companies.

show_excerpts: false # set to true to show excerpts on the homepage
permalink: pretty
baseurl: ""
url: "https://smaht.ai"

# Site logo (header mark derived from Boston skyline hero art)
logo: /assets/images/smaht-logo_40.png
logo_2x: /assets/images/smaht-logo_80.png

# Membership application (Google Form)
apply_url: "https://docs.google.com/forms/d/e/1FAIpQLSeWEKRhzM3_EvMi9Q-d8oF037vaWngHvg6iT0ZuIcxlQtlWnA/viewform"

# Recommended Greater Boston event calendars
event_calendars:
  - name: "Startup Boston"
    url: "https://www.startupbos.org/directory/events"
    logo: "/assets/images/events/startup-boston.png"
    description: "Startup events, grants, pitches, and deadlines across New England"
  - name: "AI Camp Boston"
    url: "https://www.aicamp.ai/event/eventsquery?city=US-Boston"
    logo: "/assets/images/events/ai-camp-icon.png"
    description: "AI meetups and workshops in US-Boston"
  - name: "AI Blueprint for MA"
    url: "https://ai-blueprint-ma.com/events"
    logo: "/assets/images/events/ai-blueprint-ma.jpg"
    description: "In-person AI events calendar for Boston"

