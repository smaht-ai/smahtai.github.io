# Header navigation menu
header_pages:
  - title: "People"
    url: "/people"
  - title: "Events"
    url: "/events"
  - title: "Talks"
    url: "/talks"
  - title: "Blog"
    url: "/blog"
  - title: "Resources"
    url: "#"
    children:
      - title: "Technology"
        url: "/technology"
  - title: "Info"
    url: "#"
    children:
      - title: "About"
        url: "/about"
      - title: "Contact"
        url: "/contact"
      - title: "How to Contribute"
        url: "/how-to-contribute"
  - title: "Apply"
    url: "https://docs.google.com/forms/d/e/1FAIpQLSeWEKRhzM3_EvMi9Q-d8oF037vaWngHvg6iT0ZuIcxlQtlWnA/viewform"
    button_style: "solid"
    external: true

# Footer sitemap - simplified navigation for footer display
# Note: theme footer only renders section.links (section.url alone is ignored)
site_map:
  - title: "Explore"
    links:
      - title: "People"
        url: "/people"
      - title: "Events"
        url: "/events"
      - title: "Talks"
        url: "/talks"
      - title: "Blog"
        url: "/blog"
  - title: "Resources"
    links:
      - title: "Technology"
        url: "/technology"
  - title: "Info"
    links:
      - title: "About"
        url: "/about"
      - title: "Contact"
        url: "/contact"
      - title: "How to Contribute"
        url: "/how-to-contribute"

# Build settings
theme: analytiq-pages-theme

# Exclude files from Jekyll processing
# These files will not be processed or appear as pages on the site
exclude:
  - AGENTS.md
  - CLAUDE.md
  - SVG_STYLING_GUIDE.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - Makefile
  - LICENSE
  - vendor
  - .git
  - .sass-cache
  - .jekyll-cache
  - .jekyll-metadata

# Collections
collections:
  posts:
    output: true
    permalink: /:categories/:title/
  members:
    output: true
    permalink: /people/:name/

# Pagination configuration for jekyll-paginate-v2
pagination:
  enabled: true
  per_page: 5
  permalink: "/page/:num/"
  title: ":title - Page :num"
  limit: 0
  trail:
    before: 2
    after: 2
  sort_field: "date"
  sort_reverse: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-pdf-embed
  - jekyll-paginate-v2

future: true

# Default OG/social image for pages that don't set their own image: front matter
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.png
  - scope:
      path: ""
      type: members
    values:
      layout: member

# Twitter card type - summary_large_image gives a large banner preview
twitter:
  card: summary_large_image

# GitHub repository configuration (update with your repo)
repository: smaht-ai/smahtai.github.io
