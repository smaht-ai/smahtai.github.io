title: Smaht.ai
author:
  name: Smaht.ai
  email: "hello@smaht.ai"
description: > # this means to ignore newlines until "show_excerpts:"
  Smaht.ai is a community of experienced AI engineers and entrepreneurs who are passionate about building products and building companies.

show_excerpts: false # set to true to show excerpts on the homepage
permalink: pretty
baseurl: ""
url: "https://smaht.ai"

# Membership application (Google Form)
apply_url: "https://docs.google.com/forms/d/e/1FAIpQLSeWEKRhzM3_EvMi9Q-d8oF037vaWngHvg6iT0ZuIcxlQtlWnA/viewform"

# Minima date format
# refer to https://shopify.github.io/liquid/filters/date/ if you want to customize this
minima:
  date_format: "%b %-d, %Y"

  #skin: classic
  skin: dark
  #skin: solarized-dark
  #skin: solarized

  # generate social links in footer
